<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master AI Prompt Architect Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #334155; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
        .collapsible-section { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out, opacity 0.3s ease-out, margin 0.3s ease-out; opacity: 0; }
        .collapsible-section.show { max-height: 1000px; opacity: 1; margin-top: 1rem; margin-bottom: 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 md:px-8 bg-slate-50">

<div class="max-w-7xl mx-auto">
    <header class="text-center mb-10">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-600 border border-indigo-100 mb-4">v3.2 Architect Console</span>
        <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-3">Master Prompt <span class="text-indigo-600">Generator</span></h1>
    </header>

    <div class="glass-card rounded-2xl p-6 mb-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Smart Idea Input</label>
                <div class="flex gap-2">
                    <textarea id="smartIdea" placeholder="e.g., 'Draft a flyer for a student study workshop'" class="w-full h-12 bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm focus:border-indigo-500 resize-none"></textarea>
                    <button onclick="smartFillForm()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">Smart Fill</button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Quick Presets</label>
                <div class="flex flex-wrap gap-2">
                    <button onclick="loadPreset('tutor')" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold hover:border-indigo-300">Tutor Training</button>
                    <button onclick="loadPreset('visual')" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold hover:border-amber-300">Visual Concept</button>
                    <button onclick="loadPreset('email')" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold hover:border-emerald-300">Email/Memo</button>
                    <button onclick="loadPreset('one_pager')" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold hover:border-purple-300">One-Pager</button>
                    <button onclick="loadPreset('proposal')" class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold hover:border-pink-300">Proposal</button>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 glass-card rounded-2xl p-6">
            <form id="architectForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Project Category</label>
                    <select id="category" onchange="handleCategoryChange()" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500">
                        <option value="">Select Category...</option>
                        <option value="Educational Resource">Educational Resource</option>
                        <option value="Training Material">Training Material</option>
                        <option value="AI Image">AI Image</option>
                        <option value="Professional Communication">Professional Communication</option>
                        <option value="Proposal">Proposal</option>
                        <option value="Flyer">Flyer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Final Deliverable</label>
                    <input type="text" id="deliverable" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Target Audience</label>
                    <input type="text" id="audience" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Goal / Shift</label>
                    <textarea id="outcome" class="w-full h-20 bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Key Content / Points</label>
                    <textarea id="keyPoints" class="w-full h-20 bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500"></textarea>
                </div>
                <div id="eduFields" class="collapsible-section border-l-4 border-indigo-500 pl-4">
                    <input type="text" id="objectives" placeholder="Learning Objectives..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs">
                </div>
                <button type="button" onclick="compileMasterPrompt()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">Synthesize Prompt</button>
            </form>
        </div>

        <div class="lg:col-span-7 glass-card rounded-2xl p-6 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                <h3 class="text-lg font-bold text-slate-900">Architectural Output</h3>
                <button id="copyBtn" onclick="copyPrompt()" class="hidden px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-[10px] font-bold uppercase tracking-wider">Copy Output</button>
            </div>
            <pre id="promptResult" class="flex-1 w-full bg-slate-950 text-indigo-300 p-5 rounded-xl text-xs mono-font whitespace-pre-wrap overflow-auto custom-scrollbar">Awaiting input...</pre>
        </div>
    </div>
</div>

<script>
    function handleCategoryChange() {
        const cat = document.getElementById('category').value;
        document.getElementById('eduFields').classList.toggle('show', ['Educational Resource', 'Training Material'].includes(cat));
    }

    function smartFillForm() {
        const idea = document.getElementById('smartIdea').value.toLowerCase();
        if (idea.includes('tutor') || idea.includes('training')) loadPreset('tutor');
        else if (idea.includes('flyer')) loadPreset('flyer');
        else if (idea.includes('email') || idea.includes('memo')) loadPreset('email');
        else if (idea.includes('proposal')) loadPreset('proposal');
        else if (idea.includes('visual') || idea.includes('image')) loadPreset('visual');
        else if (idea.includes('one') || idea.includes('page')) loadPreset('one_pager');
    }

    function loadPreset(type) {
        const data = {
            tutor: { cat: 'Training Material', del: 'Active Listening Guide', aud: 'Tutors', out: 'Improve tutoring effectiveness.', pts: '1. Wait 3 seconds\n2. Eye contact\n3. Paraphrase' },
            visual: { cat: 'AI Image', del: 'Concept Board', aud: 'Design Team', out: 'Create a mood board.', pts: '1. Color Palette\n2. Style Guide' },
            email: { cat: 'Professional Communication', del: 'Security Memo', aud: 'Staff', out: 'Ensure compliance.', pts: '1. Deadline Monday\n2. Security Tokens' },
            one_pager: { cat: 'Educational Resource', del: 'One-Pager', aud: 'Stakeholders', out: 'Summarize roadmap.', pts: '1. Milestones\n2. Budget\n3. Timeline' },
            proposal: { cat: 'Proposal', del: 'Funding Proposal', aud: 'Investors', out: 'Secure funding.', pts: '1. Market Gap\n2. Solution' },
            flyer: { cat: 'Flyer', del: 'Study Workshop Flyer', aud: 'Students', out: 'Drive attendance.', pts: '1. Event Date\n2. Location\n3. Benefit to student' }
        };
        const p = data[type];
        document.getElementById('category').value = p.cat;
        document.getElementById('deliverable').value = p.del;
        document.getElementById('audience').value = p.aud;
        document.getElementById('outcome').value = p.out;
        document.getElementById('keyPoints').value = p.pts;
        handleCategoryChange();
    }

    async function copyPrompt() {
        const text = document.getElementById('promptResult').innerText;
        try {
            await navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyBtn');
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy Output', 2000);
        } catch (e) {
            console.error('Copy failed', e);
        }
    }

    function compileMasterPrompt() {
        const p = `### SYSTEM ROLE\nExpert Consultant for ${document.getElementById('category').value}\n\n### DELIVERABLE\n${document.getElementById('deliverable').value} for ${document.getElementById('audience').value}\n\n### GOAL\n${document.getElementById('outcome').value}\n\n### CORE CONTENT\n${document.getElementById('keyPoints').value}\n\n### INSTRUCTION\nGenerate a professional, structured document based on these parameters.`;
        document.getElementById('promptResult').innerText = p;
        document.getElementById('copyBtn').classList.remove('hidden');
    }
</script>
</body>
</html>
